<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>DocuMint</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0e14;
        color: #e6e8ee;
        text-align: center;
      }
      .wrap {
        max-width: 320px;
      }
      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .logo span {
        color: #6366f1;
      }
      .sub {
        font-size: 14px;
        color: #9aa0ad;
        margin-bottom: 28px;
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 24px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #151a24;
        color: #e6e8ee;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active {
        background: #1d2431;
      }
      .offline {
        display: none;
      }
      body.is-offline .spinner {
        display: none;
      }
      body.is-offline .offline {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Docu<span>Mint</span></div>
      <div class="sub">Build websites &amp; apps from your phone</div>
      <div class="spinner" aria-label="Loading"></div>
      <div class="offline">
        <p class="sub">Can't reach the server. Check your connection.</p>
        <button onclick="location.reload()">Retry</button>
      </div>
    </div>
    <script>
      // This local page is only shown when the hosted app can't load. If we ever
      // land here with a live connection, try to bounce to the hosted origin.
      (function () {
        var HOSTED = "https://documintai.dev";
        if (navigator.onLine && location.protocol.indexOf("http") === 0) {
          // Served over http(s) means Capacitor loaded a real page — do nothing.
          return;
        }
        setTimeout(function () {
          if (navigator.onLine) {
            location.href = HOSTED;
          } else {
            document.body.classList.add("is-offline");
          }
        }, 2500);
        window.addEventListener("online", function () {
          location.href = HOSTED;
        });
      })();
    </script>
  </body>
</html>
