<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #030014;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #container {
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Mermaid emits a fixed-width SVG; let it scale down to the viewport
       instead of overflowing horizontally on a phone. */
    #container svg { max-width: 100%; height: auto; }
    #error {
      display: none;
      padding: 16px;
      color: #f04242;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
  <!--
    Mermaid is loaded from the same jsdelivr CDN the web app's own CSP already
    allowlists (src/proxy.ts), matching the approach used by
    assets/monaco/editor.html. This file itself ships as a bundled Flutter
    asset; only the mermaid library comes from the network.
  -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
  <div id="container"></div>
  <pre id="error"></pre>
  <script>
    let renderSeq = 0;

    function post(message) {
      if (window.FlutterBridge) {
        window.FlutterBridge.postMessage(JSON.stringify(message));
      }
    }

    function bootMermaid() {
      if (typeof mermaid === 'undefined') return false;
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        securityLevel: 'strict',
        themeVariables: {
          background: '#030014',
          primaryColor: '#995AF2',
          primaryTextColor: '#fafafa',
          lineColor: '#a1a1aa'
        }
      });
      return true;
    }

    // Called from Dart: renderDiagram("<mermaid source>")
    async function renderDiagram(code) {
      const container = document.getElementById('container');
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      container.innerHTML = '';

      if (typeof mermaid === 'undefined') {
        errorEl.textContent = 'Mermaid failed to load. Check your connection.';
        errorEl.style.display = 'block';
        post({ type: 'error', message: 'mermaid-unavailable' });
        return;
      }

      const id = 'diagram-' + (++renderSeq);
      try {
        const { svg } = await mermaid.render(id, code);
        container.innerHTML = svg;
        post({ type: 'rendered' });
      } catch (e) {
        // Mermaid injects a stray error node on failure; clear it so the
        // user sees our message rather than a half-drawn diagram.
        const stray = document.getElementById('d' + id);
        if (stray) stray.remove();
        container.innerHTML = '';
        errorEl.textContent = 'Could not render this diagram.\n\n' + (e && e.message ? e.message : e);
        errorEl.style.display = 'block';
        post({ type: 'error', message: (e && e.message) ? e.message : String(e) });
      }
    }

    window.addEventListener('load', function () {
      const ready = bootMermaid();
      post({ type: ready ? 'ready' : 'error', message: ready ? undefined : 'mermaid-unavailable' });
    });
  </script>
</body>
</html>
